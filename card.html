<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PokéRogue – Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/card-shared.css">
  <style>
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      width: 320px;
      overflow: hidden;
    }

    body {
      font-family: 'Rajdhani', 'Inter', sans-serif;
      color: #f8fbff;
    }

    #root {
      width: 320px;
    }

    /* Force vertical card layout */
    .card {
      display: flex !important;
      flex-direction: row !important;
      align-items: stretch !important;
      width: 320px !important;
      padding: var(--card-padding-v) !important;
      gap: 10px !important;
    }

    .col-left {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 4px !important;
      flex-shrink: 0 !important;
      width: var(--sprite-size) !important;
    }

    .col-right {
      display: flex !important;
      flex-direction: column !important;
      gap: 3px !important;
      flex: 1 !important;
      min-width: 0 !important;
      justify-content: center !important;
    }

    .shiny-badge { position: static !important; }
    .poke-name { font-size: var(--font-size-name-v) !important; font-weight: 700 !important; text-align: left !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; width: 100% !important; }
    .name-level { display: flex !important; align-items: baseline !important; gap: 6px !important; }
    .types { justify-content: flex-start !important; }
    .moves { display: grid !important; grid-template-columns: 1fr 1fr !important; }
  </style>
  <link rel="stylesheet" href="/custom.css">
</head>
<body>
  <div id="root"></div>

  <script src="/card-shared.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const slot   = parseInt(params.get('slot') ?? '0');

    function render(data) {
      const p = (data.party || [])[slot];
      document.getElementById('root').innerHTML = p ? renderCard(p, slot) : renderEmpty();
    }

    async function fetchData() {
      try {
        const res  = await fetch('/data', { cache: 'no-store' });
        const data = await res.json();
        render(data);
      } catch (e) {}
    }

    setInterval(fetchData, 1000);
    fetchData();
  </script>
</body>
</html>
