<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PokéRogue – Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/card-shared.css">
  <style>
    html, body {
      background: transparent;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Rajdhani', 'Inter', sans-serif;
      color: #f8fbff;
    }

    /* Strip chrome removed — just the bare card */
    .strip:not(.vertical) {
      background: none;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      backdrop-filter: none;
    }
  </style>
  <link rel="stylesheet" href="/custom.css">
</head>
<body>
  <div id="root"></div>

  <script src="/card-shared.js"></script>
  <script>
    const params    = new URLSearchParams(location.search);
    const slot      = parseInt(params.get('slot') ?? '0');
    const isMinimal = params.has('minimal');

    function render(data) {
      const p = (data.party || [])[slot];
      document.getElementById('root').innerHTML = `<div class="strip">${
        p ? renderCard(p, slot, isMinimal) : renderEmpty()
      }</div>`;
    }

    async function fetchData() {
      try {
        const res  = await fetch('/data', { cache: 'no-store' });
        const data = await res.json();
        render(data);
      } catch (e) {}
    }

    setInterval(fetchData, 1000);
    fetchData();
  </script>
</body>
</html>
