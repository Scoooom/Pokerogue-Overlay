<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PokéRogue – Run Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-body);
      font-family: var(--font-main);
      color: var(--color-text);
      display: inline-block;
    }

    .panel {
      display: inline-flex;
      flex-direction: column;
      gap: 0;
      padding: 14px 16px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-widget);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow-widget);
      min-width: 200px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--color-text-faint);
    }

    .panel-title {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    .mode-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: var(--border-radius-badge);
      background: rgba(167,139,250,0.16);
      border: 1px solid rgba(167,139,250,0.3);
      color: var(--color-passive);
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--color-text-faint);
    }

    .stat-row:last-child { border-bottom: none; }

    .stat-icon {
      font-size: 14px;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .stat-label {
      font-size: var(--stat-label-size);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      flex: 1;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: var(--stat-value-size);
      font-weight: 900;
      color: var(--color-text);
      line-height: 1;
    }

    .stat-unit {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-dim);
    }

    .stat-value.accent { color: var(--color-accent); }
    .stat-value.good   { color: var(--color-good); }
    .stat-value.shiny  { color: var(--color-shiny); }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--color-text-faint);
      margin: 4px 0;
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      margin: 4px 0;
      border: 1px solid var(--color-text-faint);
    }

    .timer-display {
      font-family: var(--font-display);
      font-size: var(--timer-size);
      font-weight: 900;
      letter-spacing: 0.03em;
      color: var(--color-accent);
    }
  </style>
  <link rel="stylesheet" href="/custom.css">
</head>
<body>
  <div class="widget">
    <div class="header">
      <span class="run-icon">🎮</span>
      <span class="header-label">Run Stats</span>
      <span class="mode-tag" id="mode">Classic</span>
    </div>

    <div class="stats">
      <div class="stat-row">
        <span class="stat-icon">🌊</span>
        <span class="stat-label">Wave</span>
        <span class="stat-value accent" id="wave">--</span>
      </div>

      <div class="stat-row">
        <span class="stat-icon">🗺️</span>
        <span class="stat-label">Biome</span>
        <span class="stat-value" id="biome" style="font-family:var(--font-main);font-weight:700;">--</span>
      </div>

      <div class="divider"></div>

      <div class="stat-row">
        <span class="stat-icon">⏱️</span>
        <span class="stat-label">Time</span>
        <span class="timer-display" id="timer">00:00</span>
      </div>

      <div class="divider"></div>

      <div class="stat-row">
        <span class="stat-icon">✨</span>
        <span class="stat-label">Shinies</span>
        <span class="stat-value shiny" id="shinies">--</span>
        <span class="stat-unit" id="shiny-max">/ 6</span>
      </div>

      <div class="stat-row">
        <span class="stat-icon">❤️</span>
        <span class="stat-label">Alive</span>
        <span class="stat-value good" id="alive">--</span>
        <span class="stat-unit">/ 6</span>
      </div>

      <div class="divider"></div>

      <div class="stat-row">
        <span class="stat-icon">💰</span>
        <span class="stat-label">Money</span>
        <span class="stat-value accent" id="money">--</span>
      </div>

      <div class="stat-row" id="runNameRow" style="display:none">
        <span class="stat-icon">🏷️</span>
        <span class="stat-label">Run</span>
        <span class="stat-value" id="runName" style="font-family:var(--font-main);font-weight:700;">--</span>
      </div>
    </div>
  </div>

  <script>
    function formatTime(seconds) {
      const s = Number(seconds) || 0;
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = Math.floor(s % 60);
      if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    // Local timer — increments every second using the server's playTime as base
    let basePlayTime = 0;
    let baseReceivedAt = Date.now();
    let timerInterval = null;

    function startLocalTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - baseReceivedAt) / 1000);
        document.getElementById('timer').textContent = formatTime(basePlayTime + elapsed);
      }, 1000);
    }

    function update(data) {
      const wave = data.wave ?? '--';
      const biome = data.biome || '--';
      const mode = data.gameMode || '';
      const team = data.party || [];
      const playTime = Number(data.playTime) || 0;

      document.getElementById('wave').textContent = wave;
      document.getElementById('biome').textContent = biome;
      document.getElementById('mode').textContent = mode;

      // Update local timer base
      basePlayTime = playTime;
      baseReceivedAt = Date.now();

      // Count shinies and alive
      const shinyCount = team.filter(p => p.shiny).length;
      const aliveCount = team.filter(p => {
        const hp = Number(p.hp ?? p.currentHP ?? 0);
        return hp > 0;
      }).length;
      const total = team.length || 6;

      document.getElementById('shinies').textContent = shinyCount;
      document.getElementById('shiny-max').textContent = `/ ${total}`;
      document.getElementById('alive').textContent = aliveCount;

      // Money
      const money = data.money ?? 0;
      document.getElementById('money').textContent = `₽${money.toLocaleString()}`;

      // Run name (only show if set)
      const runName = data.runName || '';
      const runNameRow = document.getElementById('runNameRow');
      if (runName) {
        document.getElementById('runName').textContent = runName;
        runNameRow.style.display = '';
      } else {
        runNameRow.style.display = 'none';
      }

      // Immediate timer update
      document.getElementById('timer').textContent = formatTime(playTime);
      startLocalTimer();
    }

    async function fetchData() {
      try {
        const res = await fetch('/data', { cache: 'no-store' });
        const data = await res.json();
        update(data);
      } catch (e) {}
    }

    setInterval(fetchData, 2000);
    fetchData();
  </script>
</body>
</html>
