<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PokéRogue – Wave Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <style>
    :root {
      --good:   #35e878;
      --warn:   #ffd447;
      --bad:    #ff4f5e;
      --accent: #22d3ee;
      --purple: #a78bfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: 'Rajdhani', 'Inter', sans-serif;
      color: #f8fbff;
      /* For OBS: set browser source background to transparent */
    }

    /* ── Container ─────────────────────────────── */
    .widget {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 14px 20px 14px 16px;
      background: linear-gradient(135deg, rgba(10,10,30,0.88), rgba(6,15,40,0.82));
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 28px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06) inset;
      min-width: 220px;
    }

    /* ── Top row: biome + mode ─────────────────── */
    .top-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .biome {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-accent);
      opacity: 0.9;
      flex: 1;
    }

    .mode-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(167,139,250,0.18);
      border: 1px solid rgba(167,139,250,0.35);
      color: var(--purple);
      white-space: nowrap;
    }

    /* ── Wave number ────────────────────────────── */
    .wave-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .wave-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    .wave-number {
      font-family: 'Inter', sans-serif;
      font-size: var(--wave-number-size);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #fff;
      text-shadow: 0 0 24px rgba(34,211,238,0.5);
    }

    /* ── Boss indicator ─────────────────────────── */
    .boss-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .boss-chip {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .boss-chip.now {
      background: rgba(255,79,94,0.22);
      border: 1px solid rgba(255,79,94,0.55);
      color: var(--color-bad);
      animation: pulse-bad 1.4s ease-in-out infinite;
    }
    .boss-chip.soon {
      background: rgba(255,212,71,0.18);
      border: 1px solid rgba(255,212,71,0.4);
      color: var(--color-warn);
    }
    .boss-chip.normal {
      background: rgba(53,232,120,0.12);
      border: 1px solid rgba(53,232,120,0.3);
      color: var(--color-good);
    }
    .boss-chip.hidden { opacity: 0; pointer-events: none; }

    /* Encounter type colours */
    .enc-rival       { background: rgba(167,139,250,0.18); border-color: rgba(167,139,250,0.4); color: var(--color-passive); }
    .enc-evil-grunt  { background: rgba(248,88,136,0.15);  border-color: rgba(248,88,136,0.35); color: #f85888; }
    .enc-evil-leader { background: rgba(192,48,40,0.18);   border-color: rgba(192,48,40,0.45);  color: #ff6b5b; }
    .enc-gym-leader  { background: rgba(104,144,240,0.18); border-color: rgba(104,144,240,0.4); color: #6890f0; }
    .enc-elite-four  { background: rgba(112,56,248,0.18);  border-color: rgba(112,56,248,0.4);  color: #9060f8; }
    .enc-champion    { background: rgba(255,212,71,0.2);   border-color: rgba(255,212,71,0.5);  color: var(--color-warn); }
    .enc-final-boss  { background: rgba(255,79,94,0.25);   border-color: rgba(255,79,94,0.6);   color: var(--color-bad); animation: pulse-bad 1.4s ease-in-out infinite; }
    .enc-wild-boss   { background: rgba(53,232,120,0.12);  border-color: rgba(53,232,120,0.3);  color: var(--color-good); }
    .enc-trainer     { background: rgba(168,168,120,0.15); border-color: rgba(168,168,120,0.3); color: #c0c080; }

    .next-boss-label {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
    }

    /* ── Divider ────────────────────────────────── */
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 2px 0;
    }

    @keyframes pulse-bad {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,79,94,0.4); }
      50%       { box-shadow: 0 0 0 5px rgba(255,79,94,0); }
    }

    .cycle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 2px;
    }

    .cycle-label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .cycle-val {
      font-size: 12px;
      font-weight: 700;
      flex: 1;
    }

    .cycle-btn {
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      transition: all 0.15s;
    }

    .cycle-btn:hover {
      border-color: rgba(34,211,238,0.4);
      color: var(--color-accent);
      background: rgba(34,211,238,0.08);
    }

    .cycle-btn.active {
      border-color: rgba(34,211,238,0.6);
      color: var(--color-accent);
      background: rgba(34,211,238,0.14);
    }
  </style>
  <link rel="stylesheet" href="/custom.css">
</head>
<body>
  <div class="widget">
    <div class="top-row">
      <div class="biome" id="biome">Town</div>
      <div class="mode-badge" id="mode">Classic</div>
    </div>
    <div class="divider"></div>
    <div class="wave-row">
      <div class="wave-label">Wave</div>
      <div class="wave-number" id="wave">--</div>
    </div>
    <div class="boss-row">
      <div class="boss-chip hidden" id="bossChip">BOSS NOW</div>
      <div class="next-boss-label" id="bossLabel"></div>
    </div>
    <div class="divider" style="width:100%;height:1px;background:rgba(255,255,255,0.08);margin:2px 0;"></div>
    <div class="cycle-row" id="cycleRow">
      <span class="cycle-label">Gym</span>
      <span class="cycle-val" id="cycleVal"></span>
      <a class="cycle-btn" href="/wave?cycle=20">C-20</a>
      <a class="cycle-btn" href="/wave?cycle=30">C-30</a>
      <a class="cycle-btn" href="/wave">?</a>
    </div>
  </div>

  <script>
    // ── Classic mode fixed battle map ──────────────────────────────────────────
    // Sourced from src/enums/fixed-boss-waves.ts and wiki.pokerogue.net
    const FIXED_BATTLES = {
      5:   { type: 'Trainer',     label: 'Youngster',       icon: '👦' },
      8:   { type: 'Rival',       label: 'Rival',           icon: '🤝' },
      25:  { type: 'Rival',       label: 'Rival',           icon: '🤝' },
      35:  { type: 'Evil Grunt',  label: 'Team Grunt',      icon: '😈' },
      55:  { type: 'Rival',       label: 'Rival',           icon: '🤝' },
      62:  { type: 'Evil Grunt',  label: 'Team Grunt',      icon: '😈' },
      64:  { type: 'Evil Grunt',  label: 'Team Grunt',      icon: '😈' },
      66:  { type: 'Evil Grunt',  label: 'Team Grunt',      icon: '😈' },
      95:  { type: 'Rival',       label: 'Rival',           icon: '🤝' },
      112: { type: 'Evil Grunt',  label: 'Team Grunt',      icon: '😈' },
      114: { type: 'Evil Grunt',  label: 'Team Grunt',      icon: '😈' },
      115: { type: 'Evil Leader', label: 'Team Leader',     icon: '💀' },
      145: { type: 'Rival',       label: 'Rival',           icon: '🤝' },
      164: { type: 'Evil Grunt',  label: 'Team Grunt',      icon: '😈' },
      165: { type: 'Evil Leader', label: 'Team Leader',     icon: '💀' },
      182: { type: 'Elite Four',  label: 'Elite Four',      icon: '⚔️' },
      184: { type: 'Elite Four',  label: 'Elite Four',      icon: '⚔️' },
      186: { type: 'Elite Four',  label: 'Elite Four',      icon: '⚔️' },
      188: { type: 'Elite Four',  label: 'Elite Four',      icon: '⚔️' },
      190: { type: 'Champion',    label: 'Champion',        icon: '👑' },
      195: { type: 'Rival',       label: 'Final Rival',     icon: '🤝' },
      200: { type: 'Final Boss',  label: 'Eternatus',       icon: '☄️' },
    };

    // Gym waves per cycle
    const GYM_WAVES_20  = new Set([20, 50, 80, 110, 140, 170]);
    const GYM_WAVES_30  = new Set([30, 60, 90, 120, 150, 180]);
    const GYM_WAVES_UNK = new Set([20, 30, 50, 60, 80, 90, 110, 120, 140, 150, 170, 180]);

    function getGymWaves(cycle) {
      if (cycle === 20)  return GYM_WAVES_20;
      if (cycle === 30)  return GYM_WAVES_30;
      return GYM_WAVES_UNK;
    }

    function getEncounterAt(wave, gymWaves) {
      const w = Number(wave);
      if (FIXED_BATTLES[w]) return FIXED_BATTLES[w];
      if (GYM_WAVES_UNK.has(w) && gymWaves === GYM_WAVES_UNK)
        return { type: 'Gym Leader', label: 'Gym Leader (?)', icon: '🏅' };
      if (gymWaves.has(w))
        return { type: 'Gym Leader', label: 'Gym Leader', icon: '🏅' };
      if (w % 10 === 0) return { type: 'Wild Boss', label: 'Wild Boss', icon: '⭐' };
      return null;
    }

    function getNextBoss(currentWave, gymWaves) {
      const w = Number(currentWave) || 0;
      for (let i = w; i <= 200; i++) {
        const enc = getEncounterAt(i, gymWaves);
        if (enc) return { wave: i, ...enc };
      }
      return null;
    }

    function update(data) {
      const wave    = data.wave ?? '--';
      const biome   = data.biome || 'Unknown';
      const mode    = data.gameMode || '';
      const params  = new URLSearchParams(location.search);
      const cycle   = params.has('cycle') ? Number(params.get('cycle')) : null;
      const showButtons = params.has('buttons');
      document.getElementById('cycleRow').style.display = showButtons ? '' : 'none';

      document.getElementById('wave').textContent = wave;
      document.getElementById('biome').textContent = biome;
      document.getElementById('mode').textContent = mode;

      // Update cycle display
      const cycleVal = document.getElementById('cycleVal');
      if (cycleVal) {
        cycleVal.textContent = cycle ? `C-${cycle}` : '?';
        cycleVal.style.color = cycle ? 'var(--color-good)' : 'var(--color-warn)';
      }
      // Highlight active cycle button
      document.querySelectorAll('.cycle-btn').forEach(btn => {
        const href = btn.getAttribute('href') || '';
        const btnCycle = href.includes('cycle=20') ? 20 : href.includes('cycle=30') ? 30 : null;
        btn.classList.toggle('active', btnCycle === cycle);
      });

      const gymWaves = getGymWaves(cycle);
      const next = getNextBoss(wave, gymWaves);
      const chip = document.getElementById('bossChip');
      const label = document.getElementById('bossLabel');

      if (!next || wave === '--') {
        chip.className = 'boss-chip hidden';
        label.textContent = '';
        return;
      }

      const dist = next.wave - Number(wave);
      const typeClass = 'enc-' + next.type.toLowerCase().replace(/\s+/g, '-');

      if (dist === 0) {
        chip.className = `boss-chip now ${typeClass}`;
        chip.textContent = `${next.icon} ${next.label}`;
        label.textContent = `Wave ${next.wave}`;
      } else if (dist <= 5) {
        chip.className = `boss-chip soon ${typeClass}`;
        chip.textContent = `${next.icon} ${next.label} in ${dist}`;
        label.textContent = `Wave ${next.wave}`;
      } else {
        chip.className = `boss-chip normal ${typeClass}`;
        chip.textContent = `${next.icon} ${next.label} · Wave ${next.wave}`;
        label.textContent = `${dist} waves away`;
      }
    }

    async function fetchData() {
      try {
        const res = await fetch('/data', { cache: 'no-store' });
        const data = await res.json();
        update(data);
      } catch (e) {
        document.getElementById('wave').textContent = '?';
      }
    }

    setInterval(fetchData, 1000);
    fetchData();
  </script>
</body>
</html>
