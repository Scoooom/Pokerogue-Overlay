<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>PokéRogue – Party</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/card-shared.css">
  <link rel="stylesheet" href="/custom.css">
</head>
<body>
  <div class="wrapper" id="wrapper">
    <div id="loading">Waiting for game data…</div>
  </div>

  <script src="/card-shared.js"></script>
  <script>
    const params    = new URLSearchParams(location.search);
    const isVertical = params.get('layout') === 'vertical';
    const isMinimal  = params.has('minimal');

    function render(data) {
      const team    = data.party || [];
      const slots   = [...team];
      while (slots.length < 6) slots.push(null);

      const strip = document.createElement('div');
      strip.className = 'strip' + (isVertical ? ' vertical' : '');
      strip.innerHTML = slots.map((p, i) => p ? renderCard(p, i, isMinimal) : renderEmpty()).join('');

      const wrapper = document.getElementById('wrapper');
      wrapper.innerHTML = '';

      wrapper.appendChild(strip);
    }

    async function fetchData() {
      try {
        const res  = await fetch('/data', { cache: 'no-store' });
        const data = await res.json();
        if ((data.party || []).length) render(data);
      } catch (e) {}
    }

    setInterval(fetchData, 1000);
    fetchData();
  </script>
</body>
</html>
